{% set name = "ansys-rocky-core" %}
{% set version = "0.6.2" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/ansys_rocky_core-{{ version }}.tar.gz
  sha256: a51bde5876e35b7702b67913f8d1b0ef715807bec2503bb1a7b9c6ccef077a89

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=3.2,<4
    - pip
  run:
    - python >={{ python_min }}
    - importlib-metadata >=4.0
    - pyro5 >=5.13
    - numpy >=1.19,<3.0
    - ansys-tools-common >=0.4.5
    - click ==8.5.0
test:
  imports:
    - ansys.rocky.core
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://rocky.docs.pyansys.com/
  summary: Python client library for Ansys Rocky
  dev_url: https://github.com/ansys/pyrocky
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - femarchi
    - Adrian-B-Moreira
    - fingeraugusto
    - igortg
